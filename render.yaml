# render.yaml — Render.com Blueprint
# Deploy both Backend (Web Service) + Frontend (Static Site) + PostgreSQL DB
# Docs: https://render.com/docs/blueprint-spec

services:
  # ─── Backend API (Node.js/Express) ──────────────────────────
  - type: web
    name: warsgate-bom-api
    runtime: node
    rootDir: backend
    buildCommand: npm install && npm run db:generate && npm run build
    startCommand: npx prisma db push --accept-data-loss && npx ts-node src/seed.ts && npm run start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DATABASE_URL
        value: file:./prisma/dev.db
      - key: FRONTEND_URL
        value: https://warsgate-bom.onrender.com

  # ─── Frontend React App (Static Site) ───────────────────────
  - type: web
    name: warsgate-bom
    runtime: static
    rootDir: .
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: VITE_API_URL
        value: https://warsgate-bom-api.onrender.com/api
