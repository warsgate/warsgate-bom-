# render.yaml — Render.com Blueprint
# Deploy both Backend (Web Service) + Frontend (Static Site) + PostgreSQL DB
# Docs: https://render.com/docs/blueprint-spec

services:
  # ─── Backend API (Node.js/Express) ──────────────────────────
  - type: web
    name: warsgate-bom-api
    runtime: node
    rootDir: backend
    buildCommand: npm install && npm run db:generate && npm run build && npm run db:migrate
    startCommand: npm run start
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: warsgate-bom-db
          property: connectionString
      - key: FRONTEND_URL
        value: https://warsgate-bom.onrender.com   # <-- change to your frontend URL

  # ─── Frontend React App (Static Site) ───────────────────────
  - type: web
    name: warsgate-bom
    runtime: static
    rootDir: .
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://warsgate-bom-api.onrender.com/api  # <-- your backend URL

# ─── PostgreSQL Database ─────────────────────────────────────
databases:
  - name: warsgate-bom-db
    plan: free
    databaseName: warsgate_bom
    user: warsgate
